[project]
name = "hserver"
version = "0.1.0"
description = "Hetzner Cloud Server Management Bot for Telegram"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.10.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "uv>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
    "testcontainers>=4.6.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "W", "C4", "C9", "PTH", "RUF", "SIM", "TID", "TRY", "ARG"]
ignore = ["S101", "S603", "S607"]
fixable = ["ALL"]
unfixable = ["TID252"]
exclude = [".git", "__pycache__", ".venv", "dist", "build", "*.egg-info", ".ruff_cache"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.alembic]
script_location = "bot/database/migrations"
file_template = "%%Y%%m%%d_%%H%%M%%S_%%r_%%s"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
    "testcontainers>=4.6.0",
]