name: Release Build

on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.18"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t hserver:release .

      - name: Save image
        run: |
          mkdir -p artifacts
          docker save hserver:release | gzip > artifacts/hserver-${{ github.ref_name }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hserver-release
          path: artifacts/*.tar.gz
          retention-days: 30